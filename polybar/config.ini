[colors]
background = #FF282828
background-alt = #FF3c3836

foreground = #ebdbb2
primary = #fabd2f
secondary = #8ec07c
alert = #fb4934
disabled = #a89984

bat-charging = #fabd2f
bat-full = #b8bb26
bat-low = #fb4934
charging = #a3be8c

icon-pacman = #fe8019
icon-ghost = #d3869b
icon-volume = #83a598
icon-wlan = #b8bb26
icon-backlight = #fabd2f
icon-memory = #d3869b
icon-date = #fe8019

[bar/example]
width = 100%
height = 24pt
radius = 12
dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 2.5

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}
font-0 = JetBrainsMono Nerd Font:size=10;1
font-1 = cryptocoins:style=Regular:size=10;2

modules-left = xworkspaces xwindow
modules-right = crypto filesystem battery pulseaudio backlight memory wlan eth date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces
label-active =  "󰮯"
label-active-font = 16
label-active-padding = 1
label-active-foreground = ${colors.icon-pacman}

label-occupied = "󰊠"
label-occupied-foreground = ${colors.icon-ghost}
label-occupied-padding = 1

label-urgent = "󰧵"
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = "󱙝"
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#68D2E8}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/crypto]
type = custom/script
interval = 300
exec =  /home/niis/.config/polybar/crypto.py
label-font = 2

[module/battery]
type = internal/battery
full-at = 99
low-at = 20
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.charging}

format-discharging =  <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.disabled}
format-low = <label-low> <animation-low>
format-full = <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󱓞
label-full-foreground = ${colors.bat-full}
label-low = 󰚥
label-low-foreground = ${colors.bat-low}
ramp-capacity-0 =  
ramp-capacity-1 =  
ramp-capacity-2 =  
ramp-capacity-3 =  
ramp-capacity-4 =  
bar-capacity-width = 10
animation-charging-0 =  
animation-charging-1 =  
animation-charging-2 =  
animation-charging-3 =  
animation-charging-4 =  
animation-charging-framerate = 750
animation-discharging-0 =  
animation-discharging-1 =  
animation-discharging-2 =  
animation-discharging-3 =  
animation-discharging-4 =  
animation-discharging-framerate = 500
animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 750
[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.icon-volume}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "󰝟"
label-muted-foreground = ${colors.disabled}

[module/backlight]
type = custom/script
exec = brightnessctl | grep -o "(.*" | tr -d "()"
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-
interval = 1
format-prefix = "󰖙 "
label = %output%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.icon-memory}
label = %percentage_used:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>


[module/wlan]
inherit = network-base
interface-type = wireless
interval = 0.5
format-connected = <ramp-signal> <label-connected>
format-connected-foreground = ${colors.icon-wlan}
label-connected = %essid%
label-disconnected = 󰤮
label-disconnected-foreground = ${colors.disabled}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨


[module/eth]
inherit = network-base
interface-type = wired
label-connected = 󱘖 %local_ip%
label-connected-foreground = ${colors.icon-wlan}
label-disconnected = 
label-disconnected-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.icon-date}

[module/powermenu]
type = custom/script
exec = echo "%{F#EE4E4E}󰐥"
click-left = eww open powermenu

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
