#================================#
#   PICOM CONFIG - NEW STYLE     #
#================================#

# --- Cài đặt cơ bản ---
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-rounded-corners = true;

# --- Bóng & Mờ cơ bản ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

corner-radius = 6;

# --- Cấu hình Blur ---
blur: {
    method = "dual_kawase";
    strength = 6;
    background = true;
    background-frame = false;
    background-fixed = false;
}

#================================#
#           RULES                #
#================================#

rules: (
    # RULE 1: ÉP TRONG SUỐT VÀ BLUR (Quan trọng nhất)
    # Bao gồm cả Polybar và Microsoft Edge (đúng tên bạn đã lấy)
    {
        match = "class_g = 'Alacritty' || class_g = 'Polybar' || class_g = 'Rofi' || class_g = 'Microsoft-edge' || class_g = 'microsoft-edge' || class_g = 'Code' || class_g = 'Thunar' || class_g = 'Dunst'";
        opacity = 0.85;         # <--- Chỉnh độ trong suốt ở đây (0.85 = 85%)
        blur-background = true;
    },

    # RULE 2: CẤU HÌNH RIÊNG CHO POLYBAR (Để tránh lỗi hiển thị)
    # Polybar cần tắt bóng và tắt bo góc
    {
        match = "class_g = 'Polybar'";
        shadow = false;
        corner-radius = 0;
        fade = false;
        full-shadow = false;
    },

    # RULE 3: TẮT HIỆU ỨNG CHO DOCK/DESKTOP KHÁC
    {
        match = "window_type = 'dock' || window_type = 'desktop'";
        shadow = false;
        corner-radius = 0;
        blur-background = false;
    },

    # RULE 4: MENU & POPUP (Không làm trong suốt menu chuột phải)
    {
        match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'tooltip' || window_type = 'menu' || window_type = 'utility'";
        opacity = 0.95;
        shadow = false;
        blur-background = false;
        fade = false;
    },
    
    # Import animation (nếu có lỗi thì thêm dấu # đầu dòng để tắt)
    @include "picom-animations.conf"
)
