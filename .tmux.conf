# ==========================================
# 1. CÀI ĐẶT CƠ BẢN
# ==========================================
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-option -g status-position top

# ==========================================
# 2. CẤU HÌNH PHÍM TẮT (KEYBINDINGS)
# ==========================================
unbind C-b
set -g prefix C-g
bind C-g send-prefix
bind r source-file ~/.tmux.conf \; display "Đã reload config!"

# --- Tạo Window & Chia Pane ---
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind x kill-pane

# --- Di chuyển & Resize ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -n S-Left  previous-window
bind -n S-Right next-window

# ==========================================
# 3. GIAO DIỆN GRUVBOX (MÃ MÀU TRỰC TIẾP)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- 1. Sửa lỗi viền trắng (Pane Borders) ---
# Viền khi không chọn: Màu xám (#3c3836)
set -g pane-border-style "fg=#3c3836"
# Viền khi đang chọn: Màu Cam (#d65d0e)
set -g pane-active-border-style "fg=#d65d0e"

# --- 2. Thanh Status Bar (Trong suốt) ---
set -g status-bg default
set -g status-style bg=default
set -g status-interval 1

# Fix lỗi nền vàng
setw -g window-status-current-style bg=default
setw -g window-status-style bg=default

# --- 3. Status Left (Session - Màu Cam #d65d0e) ---
set -g status-left-length 50
set -g status-left "#[fg=#d65d0e,bg=default]#[fg=#282828,bg=#d65d0e,bold] 󱐌 #S #[fg=#d65d0e,bg=default] "

# --- 4. Status Right (Giờ & Ngày - Xanh #98971a & Vàng #d79921) ---
set -g status-right-length 100
set -g status-right "#[fg=#98971a,bg=default]#[fg=#282828,bg=#98971a,bold] 󰚄 %H:%M #[fg=#98971a,bg=default] #[fg=#d79921,bg=default]#[fg=#282828,bg=#d79921,bold]  %d-%m #[fg=#d79921,bg=default]"

# --- 5. Danh sách cửa sổ (Window List) ---
setw -g window-status-separator " "

# -> Cửa sổ ĐANG CHỌN (Active): Màu Tím (#b16286)
setw -g window-status-current-format "#[fg=#b16286,bg=default]#[fg=#282828,bg=#b16286,bold]#I  #W#[fg=#b16286,bg=default]"

# -> Cửa sổ KHÔNG CHỌN (Inactive): Màu Xanh Biển (#458588)
setw -g window-status-format "#[fg=#458588,bg=default]#[fg=#282828,bg=#458588]#I #W#[fg=#458588,bg=default]"

# ==========================================
# 4. KHỞI CHẠY
# ==========================================
run '~/.tmux/plugins/tpm/tpm'
